[pytest]
# The Bridge add-on server tests (aiohttp). Not part of `python3 -m unittest discover -s tests`: this folder has no
# __init__.py, so unittest discovery skips it. Run from the repo root:
#   /home/user/.local/opt/bridge-test-venv/bin/python -m pytest tests/bridge
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
